<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu | Ghazni Afghan Kabobs, Hayward</title><meta name="description" content="Browse the Ghazni Afghan Kabobs menu: appetizers, kabob plates, entrees and more. Choose A Street or Winton Avenue."><meta name="theme-color" content="#14110c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2314110c%27/%3E%3Cpath d=%27M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z%27 fill=%27%23c9a05a%27/%3E%3C/svg%3E"><link rel="stylesheet" href="css/style.css"></head><body data-page="menu"><main id="main">
<section class="hero short light" style="background:var(--ink)"><canvas id="bg" aria-hidden="true"></canvas><div class="wrap"><span class="eyebrow">Family recipes · <span id="locname">A Street</span></span><h1 style="font-size:clamp(2.4rem,6vw,4.4rem);margin-top:.8rem">Find your next favorite.</h1><p class="lead" style="color:#e6dccb;margin-top:.8rem">Choose your location to see the right menu and prices.</p></div></section>
<section style="padding-top:2rem"><div class="wrap"><div class="seg" role="group" aria-label="Location"><button data-loc="astreet" aria-pressed="true">A Street</button><button data-loc="winton" aria-pressed="false">Winton Avenue</button></div>
<p id="addr" class="fine"></p>
<div class="mgrid" style="margin-top:1.5rem"><div class="side" id="cats" role="group" aria-label="Categories"></div><div><input class="search" id="q" type="search" placeholder="Search dishes" aria-label="Search dishes"><div id="list"></div>
<div class="cta-bar" id="order"><b id="ctat"></b><a class="btn btn-gold" id="ctab" href="#">Order</a></div></div></div></div></section></main>
<script src="js/config.js"></script><script src="js/site.js"></script><script>
const G=GHAZNI,ICON='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="32" cy="34" r="20"/><circle cx="32" cy="34" r="13"/><path d="M8 10v10M14 10v10M20 10v10M11 20v6M17 20v6"/></svg>';let loc='astreet',cat='Appetizers';
const $=s=>document.querySelector(s);
function render(){const q=$('#q').value.trim().toLowerCase(),L=G.locations[loc];
 $('#addr').textContent=L.addr+' · '+L.tel;$('#locname').textContent=L.name;
 $('#cats').innerHTML=G.menu.map(c=>`<button aria-pressed="${c.cat===cat}" data-c="${c.cat}">${c.cat}</button>`).join('');
 let items=[];G.menu.forEach(c=>{if(q||c.cat===cat)c.items.forEach(i=>{if(!q||(i.n+i.d).toLowerCase().includes(q))items.push(i)})});
 const note=loc==='winton'?'<p class="empty">Winton Avenue serves wraps, halal pizzas &amp; Mediterranean plates. Prices vary by location, so please view the full Winton menu when you order.</p>':'';
 $('#list').innerHTML=(loc==='winton'?note:'')+(items.length&&loc==='astreet'?items.map(i=>`<div class="item"><div class="ph" role="img" aria-label="${i.n}">${ICON}</div><div><h3>${i.n}</h3><p>${i.d}</p>${(i.t||[]).map(t=>`<span class="tag">${t}</span>`).join(' ')}</div><span class="price">$${i.p.toFixed(2)}</span></div>`).join(''):(loc==='astreet'?'<p class="empty">The full list for this section is available when you order online.</p>':''));
 $('#ctat').textContent='Ready to order from '+L.name+'?';const a=$('#ctab');a.href=orderHref(loc);a.textContent=orderLabel(loc);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.loc){loc=b.dataset.loc;document.querySelectorAll('[data-loc]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}
 if(b.dataset.c){cat=b.dataset.c;$('#q').value='';render()}});
$('#q').addEventListener('input',render);render();
</script></body></html>
